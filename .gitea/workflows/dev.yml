name: Dev

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: build-htz-01
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and push Docker image
        run: |
          docker build -t cr.jdbnet.co.uk/public/ipam:dev --build-arg VERSION=dev .
          docker push cr.jdbnet.co.uk/public/ipam:dev